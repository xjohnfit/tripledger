# Same domain: /api goes to FastAPI, everything else to the React app.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${APP_NAME}-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # <namespace>-<middleware name>@kubernetescrd. The annotation applies to both paths,
    # so a frontend URL starting with /api (e.g. /apiary) would also lose that prefix.
    # The app has no such routes; keep it that way, or split /api into its own Ingress.
    traefik.ingress.kubernetes.io/router.middlewares: default-${APP_NAME}-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: ${DOMAIN}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: ${APP_NAME}-backend
            port:
              number: ${BACKEND_PORT}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${APP_NAME}-frontend
            port:
              number: 80
  tls:
  - hosts:
    - ${DOMAIN}
    secretName: ${APP_NAME}-tls
